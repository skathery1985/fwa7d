name: Automated Race Corner Telemetry Pipeline

on:
  # 1. Scheduled Cron Trigger (Runs every Sunday evening after the race)
  schedule:
    - cron: '0 18 * * 0'    # Every Sunday at 18:00 UTC

  # 2. Webhook Event Trigger (Can be triggered directly by our backend when race finishes)
  repository_dispatch:
    types: [race_completed]

  # 3. Manual 1-Click Trigger (Run anytime from the GitHub website)
  workflow_dispatch:
    inputs:
      season:
        description: 'Season Year'
        default: '2026'
        required: true
      round:
        description: 'Round Number (or all)'
        default: 'latest'
        required: true